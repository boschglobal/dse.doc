name: Public HTML

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Rebuild twice daily so that changes in sibling repos are picked up.
    - cron: '0 6,12 * * *'

permissions:
  contents: write
  packages: read


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dse.doc
        uses: actions/checkout@v4
        with:
          path: dse.doc
          fetch-depth: 0

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull documentation sources
        run: make -C dse.doc pull

      - name: Build site
        run: make -C dse.doc build BUILDER_IMAGE=ghcr.io/boschglobal/dse-zensical-builder:latest

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dse.doc/build/site
          publish_branch: public_html
