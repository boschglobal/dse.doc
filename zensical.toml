[project]

site_name        = "Dynamic Simulation Environment"
site_url         = "https://boschglobal.github.io/dse.doc"
site_description = "Documentation for the DSE Core Platform - schemas, libraries, tools and workflows."
copyright        = "Robert Bosch GmbH"

docs_dir         = "content"
site_dir         = "site"

repo_url         = "https://github.com/boschglobal/dse.doc"
repo_name        = "boschglobal/dse.doc"

extra_css        = ["stylesheets/extra.css"]


# ── Markdown extensions ──────────────────────────────────────────────────────

[project.markdown_extensions.pymdownx.highlight]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

base_path = ["build/staged"]
check_paths = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.def_list]


# ── Theme ────────────────────────────────────────────────────────────────────

[project.theme]

name       = "material"
variant    = "modern"
custom_dir = "overrides"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.action.edit",
    "content.action.view",

    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tabs.sticky",
    "content.tooltips",

    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",

    "search.highlight",
    "search.suggest",
    "toc.follow",
]


# ── Theme icons ──────────────────────────────────────────────────────────────

[project.theme.icon]

previous = "lucide/arrow-left"
next     = "lucide/arrow-right"
edit     = "lucide/pencil"
view     = "lucide/eye"
repo     = "lucide/git-branch"


# ── Colour palette ───────────────────────────────────────────────────────────

[[project.theme.palette]]

scheme      = "default"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"


[[project.theme.palette]]

scheme      = "slate"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"


# ── Validation ───────────────────────────────────────────────────────────────

[project.validation]

invalid_links        = true
invalid_link_anchors = true